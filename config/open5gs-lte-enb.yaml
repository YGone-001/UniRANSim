# LTE eNB identity. These values must match the EPC served PLMN and TAC.
mcc: '460'
mnc: '02'
enbId: 0x19B
tac: 1
enbName: UERANSIM-lte-enb

# Laboratory S1-MME address on the Ubuntu Open5GS host.
s1apIp: 192.168.64.128

mme:
  address: 192.168.64.128
  port: 36412

# Maximum number of concurrently served simulated LTE UEs. Each UE keeps an
# independent S1AP context and default bearer behind the shared transports.
maxUes: 8

# One of 32, 64, 128 or 256 radio frames.
pagingDrx: 128

# LTE-only UDP transport for transparent UE NAS PDUs. It is intentionally
# separate from UERANSIM's NR radio-link sessions.
ueLink:
  address: 127.0.0.1
  port: 4998

# Real S1-U GTP-U endpoint owned by this eNB for the default EPS bearer.
s1u:
  # Must be owned by the eNB host and reachable from the SGW-U endpoint
  # delivered in Initial Context Setup Request. SGW-U owns
  # 192.168.64.128:2152 in this namespace, so use a dedicated loopback IP.
  address: 127.0.0.5
  port: 2152
  allowLoopback: true
sctp:
  maxAttempts: 3
  retryDelayMs: 2000
  responseTimeoutMs: 10000
  connectMaxAttempts: 2
  connectTimeoutMs: 1000
