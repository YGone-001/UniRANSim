# Synthetic Phase 1 LTE UE. For a live EPC run, copy this file to the ignored
# open5gs-lte-ue.local.yaml and put only authorized subscriber values there.
imsi: '460020123456789'
mcc: '460'
mnc: '02'
# Simulated radio UE identity. Must be unique among concurrently running
# lte-ue processes against the same eNB; the eNB rejects duplicates.
ueId: 1
k: '00112233445566778899AABBCCDDEEFF'
# Specify exactly one of OP or OPc. This synthetic value is not a subscriber secret.
op: '102132435465768798A9BACBDCEDFE0F'
amf: '8000'
initialSqn: '000000000000'
pdnType: IPv4
apn: internet
networkCapability: 'A020'

# One deterministic laboratory action is run after Attach. Keep attach-only for
# ordinary use; select detach, service-request, tau-normal, or tau-periodic for
# one bounded lifecycle acceptance run. tau-normal is valid only when the UE is
# actually entering a tracking area outside its assigned TAI list.
lifecycle:
  scenario: attach-only
  triggerAfterMs: 2000
  procedureTimeoutMs: 5000
  maxRetries: 3
  switchOff: false

enbLink:
  localAddress: 127.0.0.1
  localPort: 4999
  address: 127.0.0.1
  port: 4998
  timeoutMs: 15000


# LTE TUN defaults do not alter the host default route. Add only controlled
# test destinations to routes (IPv4 CIDR) when explicitly needed.
tun:
  # Keep true for acceptance. false is only a control-plane diagnostic escape
  # hatch when the caller lacks CAP_NET_ADMIN; it is never user-plane evidence.
  required: true
  namePrefix: uniransim-lte
  mtu: 1400
  routes: []
