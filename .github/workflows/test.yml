name: Test

on:
  push:
    branches: [master, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# An explicit bash runs the steps with pipefail, so a failing command is not hidden by a pipe.
defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build and test (${{ matrix.cc }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - cc: gcc
            cxx: g++
          - cc: clang
            cxx: clang++
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libsctp-dev
      - name: Build
        run: make build
      - name: Test
        run: make test

  sanitizers:
    name: Test (ASan + UBSan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libsctp-dev
      # The ASan runtime of GCC 13 fails at startup under the 32-bit mmap randomisation of newer kernels.
      - name: Reduce mmap randomisation
        run: sudo sysctl -w vm.mmap_rnd_bits=28
      - name: Configure
        run: cmake -S . -B cmake-build-asan -DCMAKE_BUILD_TYPE=Debug -DUERANSIM_SANITIZE=address,undefined
      - name: Build
        run: cmake --build cmake-build-asan --target nr-tests --parallel "$(nproc)"
      - name: Test
        run: ctest --test-dir cmake-build-asan --output-on-failure --no-tests=error

  coverage:
    name: Coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libsctp-dev gcovr
      - name: Configure
        run: cmake -S . -B cmake-build-coverage -DCMAKE_BUILD_TYPE=Debug -DUERANSIM_COVERAGE=ON
      - name: Build
        run: cmake --build cmake-build-coverage --target nr-tests --parallel "$(nproc)"
      - name: Test
        run: ctest --test-dir cmake-build-coverage --output-on-failure --no-tests=error
      - name: Report
        run: |
          report=cmake-build-coverage/report
          mkdir -p "$report"
          gcovr --root . --filter src/ --exclude 'src/(asn|ext)/' --print-summary \
                --html-details "$report/index.html" cmake-build-coverage | tee "$report/summary.txt"
          { echo '```'; cat "$report/summary.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: cmake-build-coverage/report/

  # One privileged integration only, in its own job and its own network
  # namespace, so the ordinary matrix stays unprivileged and this case cannot
  # silently pass by running in the control-plane-only mode the rest of the
  # suite deliberately uses. It needs a real kernel TUN device and the root
  # capability to create one, which is what the runner's kernel provides and
  # what a non-root suite must never assume.
  privileged-tun:
    name: Privileged LTE Mobility TUN Integration
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libsctp-dev iproute2
      - name: Configure
        run: cmake -S . -B cmake-build-privileged -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build cmake-build-privileged --target nr-tests --parallel "$(nproc)"
      - name: Verify the TUN device node
        run: |
          sudo modprobe tun
          sudo test -c /dev/net/tun
      - name: Verify root and a private network namespace
        run: |
          sudo bash -c 'test "$(id -u)" = "0"'
          sudo unshare --net -- bash -c 'test "$(id -u)" = "0" && ip link set lo up && ip link show lo'
      - name: Run the privileged TUN integration
        run: |
          sudo unshare --net -- bash -euo pipefail -c '
            ip link set lo up
            test "$(id -u)" = "0"
            test -c /dev/net/tun
            export UNIRANSIM_RUN_PRIVILEGED_TUN_TESTS=1
            ./cmake-build-privileged/nr-tests \
              --no-skip \
              --test-case="lte/ue_mobility_target: real TUN mobility restoration and user-plane round trip" \
              2>&1 | tee privileged-tun.log

            # A skipped case never reaches its own body, so it prints neither
            # sentinel and the job must not be able to call that a pass.
            grep -q "UNIRANSIM-PRIVILEGED-TUN-EXECUTED" privileged-tun.log
            grep -q "UNIRANSIM-PRIVILEGED-TUN-COMPLETE" privileged-tun.log
            grep -Eq "test cases: +1 \| +1 passed \| 0 failed" privileged-tun.log

            # The case must really have built a kernel TUN and moved IPv4
            # through it in both directions. These come from the production
            # target eNBs own per-UE user-plane statistics, so a run that fell
            # back to control-plane-only mode reports zeros and fails here
            # instead of being mistaken for a success.
            grep -q "radio-ul=1/" privileged-tun.log
            grep -q "s1u-ul=1/" privileged-tun.log
            grep -q "radio-dl=1/" privileged-tun.log
            grep -q "s1u-dl=1/" privileged-tun.log
            grep -q "drops(malformed/unknown-teid)=0/1" privileged-tun.log
            grep -q "UE Context Release Command received" privileged-tun.log
            grep -q "Released S1 context of LTE UE" privileged-tun.log
            ! grep -q "control-plane-only" privileged-tun.log
          '
      # The multi-round dedicated-bearer restoration is a second skipped case
      # and is run as its own invocation, with its own log and its own
      # sentinels, so one case's pass cannot be mistaken for the other's.
      - name: Run the privileged dedicated-bearer multi-round integration
        run: |
          sudo unshare --net -- bash -euo pipefail -c '
            ip link set lo up
            test "$(id -u)" = "0"
            test -c /dev/net/tun
            export UNIRANSIM_RUN_PRIVILEGED_TUN_TESTS=1
            ./cmake-build-privileged/nr-tests \
              --no-skip \
              --test-case="lte/ue_mobility_target: a dedicated bearer with a non-empty TFT survives three paging restorations on a real TUN" \
              2>&1 | tee privileged-tun-p17.log

            # A skipped case never reaches its own body, so it prints neither
            # sentinel and the job must not be able to call that a pass.
            grep -q "UNIRANSIM-PHASE17-PRIVILEGED-EXECUTED" privileged-tun-p17.log
            grep -q "UNIRANSIM-PHASE17-PRIVILEGED-COMPLETE" privileged-tun-p17.log
            grep -Eq "test cases: +1 \| +1 passed \| 0 failed" privileged-tun-p17.log

            # Three complete Paging restorations of one registration: three
            # matched pages, three Service Requests, three restorations and no
            # second Attach.
            grep -q "Paging statistics: indications=3 matched=3 ignored=0" privileged-tun-p17.log
            grep -q "service-requests=3 restorations=3 restoration-failures=0" privileged-tun-p17.log
            test "$(grep -c "State=ATTACH_REQUEST_SENT" privileged-tun-p17.log)" -eq 1
            test "$(grep -c "State=ATTACH_COMPLETE_SENT" privileged-tun-p17.log)" -eq 1

            # The radio answer form: one bearer-inventory declaration to the
            # fresh cell and two compact Service Requests to the cell that had
            # since confirmed the roles.
            test "$(grep -c "bearer-inventory Service Request sent for the network-triggered restoration" privileged-tun-p17.log)" -eq 1
            test "$(grep -c "compact EPS Service Request sent for the network-triggered restoration" privileged-tun-p17.log)" -eq 2
            grep -q "bootstrap=DECLARE_REQUIRED" privileged-tun-p17.log
            grep -q "bootstrap=ROLES_RETAINED" privileged-tun-p17.log

            # Every round restored both bearers at its own access generation.
            grep -q "confirm-gen=1" privileged-tun-p17.log
            grep -q "confirm-gen=2" privileged-tun-p17.log
            grep -q "confirm-gen=3" privileged-tun-p17.log

            # Independent user plane on both bearers: the UE moved one packet
            # per direction per bearer per round, and the eNB forwarded the
            # same six each way. A control-plane-only run reports zeros here.
            grep -q "dedicated-ul=3 dedicated-dl=3" privileged-tun-p17.log
            grep -q "tun-ul=6/" privileged-tun-p17.log
            grep -q "tun-dl=6/" privileged-tun-p17.log
            grep -q "radio-ul=6/" privileged-tun-p17.log
            grep -q "radio-dl=6/" privileged-tun-p17.log
            grep -q "s1u-ul=6/" privileged-tun-p17.log
            grep -q "s1u-dl=6/" privileged-tun-p17.log

            # Previous-round transport stays dead and is classified, not
            # delivered and not able to disturb the bearer that replaced it.
            grep -q "Dropped S1-U T-PDU for retired TEID" privileged-tun-p17.log
            grep -q "GTP-U End Marker for retired tunnel TEID" privileged-tun-p17.log
            grep -q "drops(malformed/teid/peer/inactive)=0/0/0/0" privileged-tun-p17.log
            ! grep -q "control-plane-only" privileged-tun-p17.log
          '
      # The connected-mode handover acceptance is a third skipped case: two
      # real eNBs, one running UE and an isolated MME relay. It gets its own
      # invocation, its own log and its own sentinels, so one case's pass
      # cannot be mistaken for another's.
      - name: Run the privileged connected-mode handover acceptance
        run: |
          sudo unshare --net -- bash -euo pipefail -c '
            ip link set lo up
            test "$(id -u)" = "0"
            test -c /dev/net/tun
            export UNIRANSIM_RUN_PRIVILEGED_TUN_TESTS=1
            ./cmake-build-privileged/nr-tests \
              --no-skip \
              --test-case="lte/handover/acceptance: a connected-mode handover executes end to end between two real eNBs" \
              2>&1 | tee privileged-tun-p18d.log

            # A skipped case never reaches its own body, so it prints neither
            # sentinel and the job must not be able to call that a pass.
            grep -q "UNIRANSIM-PHASE18D-PRIVILEGED-EXECUTED" privileged-tun-p18d.log
            grep -q "UNIRANSIM-PHASE18D-PRIVILEGED-COMPLETE" privileged-tun-p18d.log
            grep -Eq "test cases: +1 \| +1 passed \| 0 failed" privileged-tun-p18d.log

            # Exactly one Attach: a connected-mode handover is not an Attach
            # and must not fall back to a Service Request either.
            test "$(grep -c "State=ATTACH_REQUEST_SENT" privileged-tun-p18d.log)" -eq 1
            test "$(grep -c "State=ATTACH_COMPLETE_SENT" privileged-tun-p18d.log)" -eq 1
            ! grep -q "compact EPS Service Request" privileged-tun-p18d.log
            ! grep -q "bearer-inventory Service Request" privileged-tun-p18d.log

            # The UE consumed the command in its own runtime and moved its
            # radio transport to the authorized target cell, and the target
            # verified the arrival in its own production receive path.
            grep -q "S1 context established (eNB-UE-S1AP-ID=1, MME-UE-S1AP-ID=201)" privileged-tun-p18d.log
            grep -q "Connected-mode handover command accepted (MME-UE-S1AP-ID=201)" privileged-tun-p18d.log
            grep -q "SIMULATED_HANDOVER_ACCESS sent to the target cell" privileged-tun-p18d.log
            grep -q "Verified handover arrival of LTE UE 7 to this cell from eNB 74565" privileged-tun-p18d.log

            # The transaction reached the intentional final state and stopped
            # there: no source release and no core path update is claimed.
            grep -q "AWAITING_CORE_PATH_UPDATE" privileged-tun-p18d.log

            # Real IPv4 crossed a kernel TUN in both directions on both bearers
            # and the dedicated bearer carried its own flow. A run that stayed
            # control-plane-only reports zeros here.
            grep -q "tun-ul=2/" privileged-tun-p18d.log
            grep -q "tun-dl=2/" privileged-tun-p18d.log
            grep -q "dedicated-ul=1 dedicated-dl=1" privileged-tun-p18d.log
            grep -q "LTE UE shutdown complete" privileged-tun-p18d.log
            ! grep -q "control-plane-only" privileged-tun-p18d.log
          '
      # The isolated core path migration and source release is a fourth skipped
      # case: the accepted Phase 18-D sequence extended past its own boundary
      # into a real SGW forwarding-map switch and an MME-authorized source
      # release. It gets its own invocation, its own log and its own sentinels,
      # so one case's pass cannot be mistaken for another's.
      - name: Run the privileged core path migration and source release acceptance
        run: |
          sudo unshare --net -- bash -euo pipefail -c '
            ip link set lo up
            test "$(id -u)" = "0"
            test -c /dev/net/tun
            export UNIRANSIM_RUN_PRIVILEGED_TUN_TESTS=1
            ./cmake-build-privileged/nr-tests \
              --no-skip \
              --test-case="lte/handover/acceptance: mme-controlled core path migration and source release complete an isolated s1 handover" \
              2>&1 | tee privileged-tun-p18e.log

            # A skipped case never reaches its own body, so it prints neither
            # sentinel and the job must not be able to call that a pass.
            grep -q "UNIRANSIM-PHASE18E-PRIVILEGED-EXECUTED" privileged-tun-p18e.log
            grep -q "UNIRANSIM-PHASE18E-PRIVILEGED-COMPLETE" privileged-tun-p18e.log
            grep -Eq "test cases: +1 \| +1 passed \| 0 failed" privileged-tun-p18e.log

            # The isolated SGW really installed the replacement and the MME
            # verified it against the map it read back, rather than trusting
            # the answer it asked for.
            grep -q "Isolated SGW holds the source downlink path" privileged-tun-p18e.log
            grep -q "Isolated SGW published downlink path generation 2" privileged-tun-p18e.log
            grep -q "Isolated MME confirmed downlink path generation 2" privileged-tun-p18e.log

            # The old-path End Marker was classified as a control message and
            # released nothing.
            grep -q "Isolated SGW sent an End Marker on the old path" privileged-tun-p18e.log
            grep -q "GTP-U End Marker for active tunnel TEID" privileged-tun-p18e.log

            # The source was released by an MME decision, through a real
            # encoded command, and answered with a real encoded Complete. The
            # source TEIDs are retired and the old-path packet is refused.
            grep -q "Isolated MME sent a UE Context Release Command (radioNetwork/successful-handover)" privileged-tun-p18e.log
            grep -q "Released the source S1 context of LTE UE 7 for a completed handover" privileged-tun-p18e.log
            grep -q "Isolated MME verified the UE Context Release Complete" privileged-tun-p18e.log
            grep -q "Dropped S1-U T-PDU for retired TEID" privileged-tun-p18e.log
            grep -q "no idle-release notification was sent" privileged-tun-p18e.log

            # Exactly one Attach: a handover is not an Attach and the release is
            # not an idle Service Request.
            test "$(grep -c "State=ATTACH_REQUEST_SENT" privileged-tun-p18e.log)" -eq 1
            test "$(grep -c "State=ATTACH_COMPLETE_SENT" privileged-tun-p18e.log)" -eq 1
            ! grep -q "compact EPS Service Request" privileged-tun-p18e.log
            ! grep -q "bearer-inventory Service Request" privileged-tun-p18e.log

            # Real IPv4 crossed a kernel TUN in both directions before and after
            # the migration: four uplink datagrams and six downlink ones. A run
            # that stayed control-plane-only reports zeros here.
            grep -q "tun-ul=4/" privileged-tun-p18e.log
            grep -q "tun-dl=6/" privileged-tun-p18e.log
            grep -q "LTE UE shutdown complete" privileged-tun-p18e.log
            ! grep -q "control-plane-only" privileged-tun-p18e.log
          '
      - name: Report
        if: always()
        run: |
          for log in privileged-tun.log privileged-tun-p17.log privileged-tun-p18d.log privileged-tun-p18e.log; do
            if [ -f "$log" ]; then
              { echo "### $log"; echo '```'; cat "$log"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            else
              echo "The privileged TUN integration produced no $log at all." >> "$GITHUB_STEP_SUMMARY"
            fi
          done
